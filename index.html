<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dashboard Data Staff</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .login-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
      animation: rotate 20s linear infinite;
    }
    @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .login-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); padding: 50px 45px; border-radius: 25px; box-shadow: 0 25px 50px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.3); width: 100%; max-width: 480px; text-align: center; position: relative; z-index: 1; transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .login-logo h1 { display: flex; align-items: center; justify-content: center; gap: 15px; font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #2c3e50, #3498db); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .login-tabs { display: flex; margin-bottom: 40px; border-radius: 15px; overflow: hidden; background: rgba(52,152,219,0.1); }
    .login-tab { flex: 1; padding: 16px; border: none; cursor: pointer; font-weight: 700; color: #333; }
    .login-tab.active { background: linear-gradient(135deg, #3498db, #2980b9); color: white; }
    .login-form { display: none; }
    .login-form.active { display: block; }
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group input { width: 100%; padding: 15px; border: 2px solid #ccc; border-radius: 10px; }
    .btn-login { width: 100%; background: linear-gradient(135deg, #3498db, #2980b9); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .error-message, .success-message { display: none; margin-bottom: 20px; padding: 15px; border-radius: 10px; color: white; font-weight: 600; }
    .error-message { background: #e74c3c; }
    .success-message { background: #2ecc71; }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card floating">
      <div class="login-logo">
        <h1><i class="fas fa-chart-line"></i> Dashboard Staff</h1>
      </div>

      <div class="login-tabs">
        <button class="login-tab active" data-tab="login">Login</button>
        <button class="login-tab" data-tab="register">Register</button>
      </div>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <!-- Login -->
      <form id="loginForm" class="login-form active">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" required placeholder="Masukkan email Anda" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" required placeholder="Masukkan password Anda" />
        </div>
        <button type="submit" class="btn-login">Masuk ke Dashboard</button>
      </form>

      <!-- Register -->
      <form id="registerForm" class="login-form">
        <div class="form-group">
          <label for="registerName">Nama Lengkap</label>
          <input id="registerName" type="text" required placeholder="Masukkan nama lengkap" />
        </div>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" required placeholder="Masukkan email Anda" />
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" required placeholder="Buat password minimal 6 karakter" />
        </div>
        <div class="form-group">
          <label for="registerConfirmPassword">Konfirmasi Password</label>
          <input id="registerConfirmPassword" type="password" required placeholder="Ulangi password Anda" />
        </div>
        <button type="submit" class="btn-login">Daftar Akun Baru</button>
      </form>
    </div>
  </div>

  <!-- ✅ Firebase Login + Register + Firestore User -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // 🔥 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyClRE2w0JeSj81gkccPC1au3hG8lQYbLzw",
      authDomain: "dashboard-png.firebaseapp.com",
      projectId: "dashboard-png",
      storageBucket: "dashboard-png.firebasestorage.app",
      messagingSenderId: "121187805643",
      appId: "1:121187805643:web:6c67dd587abbe09f782e4e",
      measurementId: "G-N5MV2N5X33"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const tabs = document.querySelectorAll('.login-tab');
    const forms = document.querySelectorAll('.login-form');
    const errorBox = document.getElementById('errorMessage');
    const successBox = document.getElementById('successMessage');

    function showError(msg){ errorBox.textContent = msg; errorBox.style.display = 'block'; successBox.style.display = 'none'; }
    function showSuccess(msg){ successBox.textContent = msg; successBox.style.display = 'block'; errorBox.style.display = 'none'; }
    function hideMessages(){ errorBox.style.display = 'none'; successBox.style.display = 'none'; }

    tabs.forEach(tab => {
      tab.addEventListener('click', ()=> {
        tabs.forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        forms.forEach(f=>f.classList.remove('active'));
        document.getElementById(`${tab.dataset.tab}Form`).classList.add('active');
        hideMessages();
      });
    });

    // Fungsi buat doc user di Firestore
    async function ensureUserDoc(user, name = null) {
      const userRef = doc(db, 'users', user.uid);
      const snap = await getDoc(userRef);
      if (!snap.exists()) {
        const isAdmin = user.email === "admin@company.com";
        await setDoc(userRef, {
          uid: user.uid,
          email: user.email,
          username: name || user.email.split('@')[0],
          role: isAdmin ? "admin" : "staff",
          canEdit: isAdmin,
          createdAt: serverTimestamp()
        });
      }
    }

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim().toLowerCase();
      const password = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerConfirmPassword').value;

      if (password !== confirm) return showError('Konfirmasi password tidak cocok.');
      try {
        const res = await createUserWithEmailAndPassword(auth, email, password);
        await ensureUserDoc(res.user, name);
        showSuccess('Pendaftaran berhasil! Mengalihkan...');
        setTimeout(()=>window.location.href='dashboard.html',1000);
      } catch (err) {
        showError(err.message);
      }
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;
      try {
        const res = await signInWithEmailAndPassword(auth, email, password);
        await ensureUserDoc(res.user);
        showSuccess('Login berhasil! Mengalihkan...');
        setTimeout(()=>window.location.href='dashboard.html',1000);
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
  <script type="module" src="login.js"></script>
</body>
</html>
