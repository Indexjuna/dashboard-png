<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Dashboard Staff</title>
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 400px;
      padding: 40px;
      text-align: center;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .tabs {
      display: flex;
      margin-bottom: 25px;
    }
    .tabs button {
      flex: 1;
      padding: 10px;
      border: none;
      cursor: pointer;
      background: #f0f0f0;
      font-weight: bold;
      transition: 0.3s;
    }
    .tabs button.active {
      background: #34495e;
      color: white;
    }
    form {
      display: none;
      flex-direction: column;
      gap: 15px;
    }
    form.active {
      display: flex;
    }
    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
    }
    button.submit-btn {
      background: #3498db;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    button.submit-btn:hover {
      background: #2980b9;
    }
    .message {
      margin-top: 15px;
      font-size: 0.9rem;
      display: none;
      border-radius: 10px;
      padding: 10px;
    }
    .error {
      background: #e74c3c;
      color: white;
    }
    .success {
      background: #2ecc71;
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2><i class="fas fa-chart-line"></i> Dashboard Staff</h2>

    <div class="tabs">
      <button id="loginTab" class="active">Login</button>
      <button id="registerTab">Register</button>
    </div>

    <div id="message" class="message"></div>

    <!-- Login Form -->
    <form id="loginForm" class="active">
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit" class="submit-btn">Masuk</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm">
      <input type="text" id="registerName" placeholder="Nama Lengkap" required />
      <input type="email" id="registerEmail" placeholder="Email" required />
      <input type="password" id="registerPassword" placeholder="Password" required />
      <input
        type="password"
        id="registerConfirm"
        placeholder="Konfirmasi Password"
        required
      />
      <button type="submit" class="submit-btn">Daftar</button>
    </form>
  </div>

  <!-- Firebase -->
  <script type="module">
    // Import SDK dari Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    // Konfigurasi Firebase (SUDAH DIBENERIN)
    const firebaseConfig = {
      apiKey: "AIzaSyDt0pviC800bgk0t6zDPnN3GJSGdMKMj4",
      authDomain: "dashboard-staff-4b3eb.firebaseapp.com",
      projectId: "dashboard-staff-4b3eb",
      storageBucket: "dashboard-staff-4b3eb.appspot.com",
      messagingSenderId: "149309840975",
      appId: "1:149309840975:web:3ffbe181bb4b7dd4b5c45a",
      measurementId: "G-EVGPRQQG1F"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Elemen DOM
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const messageBox = document.getElementById("message");

    // Ganti tab
    loginTab.onclick = () => {
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
      loginForm.classList.add("active");
      registerForm.classList.remove("active");
      messageBox.style.display = "none";
    };
    registerTab.onclick = () => {
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
      registerForm.classList.add("active");
      loginForm.classList.remove("active");
      messageBox.style.display = "none";
    };

    // Fungsi pesan
    function showMessage(type, text) {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
      messageBox.style.display = "block";
    }

    // Handle login
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMessage("success", "Login berhasil! Mengalihkan ke dashboard...");
        setTimeout(() => (window.location.href = "dashboard.html"), 1500);
      } catch (error) {
        showMessage("error", "Gagal login: " + error.message);
      }
    });

    // Handle register
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("registerName").value.trim();
      const email = document.getElementById("registerEmail").value.trim();
      const password = document.getElementById("registerPassword").value.trim();
      const confirm = document.getElementById("registerConfirm").value.trim();

      if (password !== confirm) {
        showMessage("error", "Konfirmasi password tidak cocok.");
        return;
      }

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        showMessage("success", "Pendaftaran berhasil! Silakan login.");
        setTimeout(() => {
          registerTab.click();
        }, 1500);
      } catch (error) {
        showMessage("error", "Gagal daftar: " + error.message);
      }
    });
  </script>
</body>
</html>
