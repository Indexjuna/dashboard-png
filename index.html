<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dashboard Data Staff</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    /* ==== STYLE LOGIN === */
    :root {
      --primary-color: #3498db;
      --dark-text: #2c3e50;
      --light-text: #7f8c8d;
    }
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 25px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }
    .login-logo h1 {
      color: var(--dark-text);
      font-weight: 800;
      font-size: 2rem;
      background: linear-gradient(135deg, #2c3e50, #3498db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-tabs {
      display: flex;
      margin-bottom: 30px;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(52, 152, 219, 0.1);
    }
    .login-tab {
      flex: 1;
      padding: 12px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      color: var(--dark-text);
      transition: 0.3s;
      background: transparent;
    }
    .login-tab.active {
      background: var(--primary-color);
      color: white;
    }
    .login-form {
      display: none;
    }
    .login-form.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from {opacity:0; transform:translateY(20px);}
      to {opacity:1; transform:translateY(0);}
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .btn-login {
      width: 100%;
      background: var(--primary-color);
      border: none;
      padding: 14px;
      color: white;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-login:hover {
      background: #2980b9;
    }
    .error-message, .success-message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }
    .error-message {
      background: #e74c3c;
      color: white;
    }
    .success-message {
      background: #27ae60;
      color: white;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <h1><i class="fas fa-chart-line"></i> Dashboard Staff</h1>
      </div>

      <div class="login-tabs">
        <button class="login-tab active" data-tab="login">Login</button>
        <button class="login-tab" data-tab="register">Register</button>
      </div>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <form id="loginForm" class="login-form active">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit" class="btn-login">Masuk</button>
      </form>

      <form id="registerForm" class="login-form">
        <input type="text" id="registerName" placeholder="Nama Lengkap" required>
        <input type="email" id="registerEmail" placeholder="Email" required>
        <input type="password" id="registerPassword" placeholder="Password" required>
        <input type="password" id="registerConfirmPassword" placeholder="Konfirmasi Password" required>
        <button type="submit" class="btn-login">Daftar</button>
      </form>
    </div>
  </div>

  <!-- ==== FIREBASE SCRIPT ==== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
      from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    // === KONFIGURASI FIREBASE KAMU ===
    const firebaseConfig = {
      apiKey: "AIzaSyDt0pviC800bgk0t6zDPnN3GJSGdMKMj4",
      authDomain: "dashboard-staff-4b3eb.firebaseapp.com",
      projectId: "dashboard-staff-4b3eb",
      storageBucket: "dashboard-staff-4b3eb.firebasestorage.app",
      messagingSenderId: "149309840975",
      appId: "1:149309840975:web:3ffbe181bb4b7dd4b5c45a",
      measurementId: "G-EVGPRQQG1F"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ==== DOM ELEMENTS ====
    const loginTabs = document.querySelectorAll(".login-tab");
    const loginForms = document.querySelectorAll(".login-form");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");

    // ==== TAB SWITCH ====
    loginTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        loginTabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        loginForms.forEach(f => f.classList.remove("active"));
        document.getElementById(tab.dataset.tab + "Form").classList.add("active");
        clearMessages();
      });
    });

    // ==== LOGIN ====
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessages();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showSuccess("Login berhasil! Mengalihkan...");
        setTimeout(() => window.location.href = "dashboard.html", 1500);
      } catch (error) {
        showError("Gagal login: " + error.message);
      }
    });

    // ==== REGISTER ====
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessages();

      const name = document.getElementById("registerName").value;
      const email = document.getElementById("registerEmail").value;
      const password = document.getElementById("registerPassword").value;
      const confirmPassword = document.getElementById("registerConfirmPassword").value;

      if (password !== confirmPassword) {
        showError("Password tidak cocok.");
        return;
      }

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        showSuccess("Akun berhasil dibuat! Silakan login.");
        registerForm.reset();
        loginTabs[0].click(); // Pindah ke tab login
      } catch (error) {
        showError("Gagal daftar: " + error.message);
      }
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.style.display = "block";
    }
    function showSuccess(msg) {
      successMessage.textContent = msg;
      successMessage.style.display = "block";
    }
    function clearMessages() {
      errorMessage.style.display = "none";
      successMessage.style.display = "none";
    }
  </script>
</body>
</html>
