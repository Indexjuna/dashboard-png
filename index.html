<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Dashboard Data Staff</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <h1><i class="fas fa-chart-line"></i> Dashboard Staff</h1>
      </div>

      <div class="login-tabs">
        <button class="login-tab active" data-tab="login">Login</button>
        <button class="login-tab" data-tab="register">Register</button>
      </div>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <!-- Login -->
      <form id="loginForm" class="login-form active">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" required placeholder="Masukkan email Anda" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" required placeholder="Masukkan password Anda" />
        </div>
        <button type="submit" class="btn-login">Masuk ke Dashboard</button>
      </form>

      <!-- Register -->
      <form id="registerForm" class="login-form">
        <div class="form-group">
          <label for="registerName">Nama Lengkap</label>
          <input id="registerName" type="text" required placeholder="Masukkan nama lengkap" />
        </div>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" required placeholder="Masukkan email Anda" />
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" required placeholder="Buat password minimal 6 karakter" />
        </div>
        <div class="form-group">
          <label for="registerConfirmPassword">Konfirmasi Password</label>
          <input id="registerConfirmPassword" type="password" required placeholder="Ulangi password Anda" />
        </div>
        <button type="submit" class="btn-login">Daftar Akun Baru</button>
      </form>
    </div>
  </div>

  <!-- SCRIPT FIREBASE -->
  <script type="module">
    import { auth, db } from "./firebase.js";
    import { createUserWithEmailAndPassword, signInWithEmailAndPassword } 
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { doc, setDoc, getDoc, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const tabs = document.querySelectorAll(".login-tab");
    const forms = document.querySelectorAll(".login-form");
    const errorBox = document.getElementById("errorMessage");
    const successBox = document.getElementById("successMessage");

    function showError(msg){ errorBox.textContent = msg; errorBox.style.display = "block"; successBox.style.display = "none"; }
    function showSuccess(msg){ successBox.textContent = msg; successBox.style.display = "block"; errorBox.style.display = "none"; }

    tabs.forEach(tab=>{
      tab.addEventListener("click",()=>{
        tabs.forEach(t=>t.classList.remove("active"));
        tab.classList.add("active");
        forms.forEach(f=>f.classList.remove("active"));
        document.getElementById(`${tab.dataset.tab}Form`).classList.add("active");
      });
    });

    async function ensureUserDoc(userAuth, displayName) {
      const userRef = doc(db, "users", userAuth.uid);
      const snap = await getDoc(userRef);
      if (!snap.exists()) {
        const isAdmin = userAuth.email === "admin@company.com";
        await setDoc(userRef, {
          uid: userAuth.uid,
          email: userAuth.email,
          username: displayName || userAuth.email.split("@")[0],
          role: isAdmin ? "admin" : "staff",
          canEdit: isAdmin,
          createdAt: serverTimestamp()
        });
      }
    }

    document.getElementById("registerForm").addEventListener("submit", async e=>{
      e.preventDefault();
      const name = registerName.value.trim();
      const email = registerEmail.value.trim().toLowerCase();
      const pass = registerPassword.value;
      const confirm = registerConfirmPassword.value;
      if (pass !== confirm) return showError("Konfirmasi password tidak cocok");
      try {
        const res = await createUserWithEmailAndPassword(auth,email,pass);
        await ensureUserDoc(res.user,name);
        showSuccess("Pendaftaran berhasil! Mengalihkan...");
        setTimeout(()=>location.href="dashboard.html",700);
      } catch(err){ showError(err.message); }
    });

    document.getElementById("loginForm").addEventListener("submit", async e=>{
      e.preventDefault();
      const email = loginEmail.value.trim().toLowerCase();
      const pass = loginPassword.value;
      try {
        const res = await signInWithEmailAndPassword(auth,email,pass);
        await ensureUserDoc(res.user);
        showSuccess("Login berhasil! Mengalihkan...");
        setTimeout(()=>location.href="dashboard.html",700);
      } catch(err){ showError(err.message); }
    });
  </script>
</body>
</html>
