<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Staff - Login</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 {
      color: #2a4d8f;
      margin-bottom: 1rem;
    }
    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .tabs button {
      flex: 1;
      border: none;
      background: #e8eefc;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .tabs button.active {
      background: #2a4d8f;
      color: white;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }
    button.submit {
      width: 100%;
      background: #2a4d8f;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .error {
      background: #f44336;
      color: white;
      padding: 8px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📊 Dashboard Staff</h2>
    <div class="tabs">
      <button id="loginTab" class="active">Login</button>
      <button id="registerTab">Register</button>
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button class="submit" id="submitBtn">Masuk</button>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

  <script>
    // 🔥 Firebase Config kamu
    const firebaseConfig = {
      apiKey: "AIzaSyDt0pviC800bgk0t6zDPnN3GJSGdMKMj4",
      authDomain: "dashboard-staff-4b3eb.firebaseapp.com",
      projectId: "dashboard-staff-4b3eb",
      storageBucket: "dashboard-staff-4b3eb.appspot.com",
      messagingSenderId: "149309840975",
      appId: "1:149309840975:web:3ffbe181bb4b7dd4b5c45a",
      measurementId: "G-EVGPRQQG1F"
    };

    // 🔧 Inisialisasi Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Elemen UI
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const submitBtn = document.getElementById("submitBtn");
    const errorBox = document.getElementById("errorBox");
    let mode = "login";

    loginTab.addEventListener("click", () => {
      mode = "login";
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
      submitBtn.textContent = "Masuk";
    });

    registerTab.addEventListener("click", () => {
      mode = "register";
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
      submitBtn.textContent = "Daftar";
    });

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }

    submitBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      errorBox.style.display = "none";

      if (!email || !password) {
        showError("Harap isi semua kolom.");
        return;
      }

      try {
        if (mode === "login") {
          await auth.signInWithEmailAndPassword(email, password);
          window.location.href = "dashboard.html";
        } else {
          const userCredential = await auth.createUserWithEmailAndPassword(email, password);
          const user = userCredential.user;
          await db.collection("users").doc(user.uid).set({
            email: email,
            role: "staff",
            createdAt: new Date()
          });
          alert("Pendaftaran berhasil! Silakan login.");
          loginTab.click();
        }
      } catch (error) {
        showError("Gagal " + mode + ": " + error.message);
      }
    });
  </script>
</body>
</html>
