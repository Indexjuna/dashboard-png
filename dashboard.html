<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Data Staff</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="dashboard-container">
    <div class="sidebar">
      <div class="logo">
        <h2><i class="fas fa-chart-line"></i> Dashboard</h2>
        <p id="userEmail">Memuat...</p>
      </div>
      <ul class="menu">
        <li class="menu-item active" data-content="home"><i class="fas fa-home"></i> Dashboard</li>
        <li class="menu-item" data-content="hatoribet"><i class="fas fa-users"></i> Hatoribet</li>
        <li class="menu-item" data-content="livitoto"><i class="fas fa-user-tie"></i> Livitoto</li>
        <li class="menu-item" data-content="hmd29"><i class="fas fa-user-friends"></i> HMD29</li>
        <li class="menu-item" data-content="users"><i class="fas fa-user-circle"></i> Users</li>
      </ul>
    </div>

    <div class="main-content">
      <header class="header">
        <div class="header-left">
          <button id="menuToggle" class="btn"><i class="fas fa-bars"></i></button>
          <h1 id="pageTitle">Dashboard Home</h1>
        </div>
        <div class="header-right">
          <span id="userName"></span>
          <button id="logoutBtn" class="btn" style="background:#e74c3c;color:white"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
      </header>
      <div class="content-area" id="contentArea">Memuat...</div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
